openapi: 3.1.0
info:
  title: Laravel Ecommerce API
  version: 1.0.0
  description: API documentation for the Laravel-based marketplace backend.

paths:

  # ─────────────────────────────────────────────────────────────
  # Users
  # ─────────────────────────────────────────────────────────────
  /api/v1/users:
    get:
      summary: List all users
      tags: [Users]
      parameters:
        - $ref: '#/components/parameters/verified_query'
        - $ref: '#/components/parameters/admin_query'
        - $ref: '#/components/parameters/sort_by_query'
        - $ref: '#/components/parameters/desc_query'
        - $ref: '#/components/parameters/per_page_query'
      responses:
        '200':
          description: List of users.
    post:
      summary: Create a new user
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/user_store_input'
      responses:
        '201':
          description: User created.

  /api/v1/users/{user}:
    parameters:
      - name: user
        in: path
        required: true
        description: "Encrypted user ID"
        schema:
          $ref: '#/components/schemas/encrypted_id'
    get:
      summary: Get user by encrypted ID
      tags: [Users]
      responses:
        '200': { description: User found. }
    put:
      summary: Update user by encrypted ID
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/user_update_input'
            example:
              name: Jane Doe Updated
              email: jane.updated@example.com
              password: secret123
              password_confirmation: secret123
              admin: false
      responses:
        '200': { description: User updated. }
    patch:
      summary: Partially update user by encrypted ID
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/user_update_input'
            example:
              name: Jane Partial
              admin: true
      responses:
        '200': { description: User partially updated. }
    delete:
      summary: Delete user by encrypted ID
      tags: [Users]
      responses:
        '200': { description: User deleted. }

  # ─────────────────────────────────────────────────────────────
  # Buyers
  # ─────────────────────────────────────────────────────────────
  /api/v1/buyers:
    get:
      summary: List all buyers
      tags: [Buyers]
      parameters:
        - $ref: '#/components/parameters/verified_query'
        - $ref: '#/components/parameters/sort_by_query'
        - $ref: '#/components/parameters/desc_query'
        - $ref: '#/components/parameters/per_page_query'
      responses:
        '200': { description: List of buyers. }

  /api/v1/buyers/{buyer}:
    parameters:
      - name: buyer
        in: path
        required: true
        description: "Encrypted buyer ID"
        schema:
          $ref: '#/components/schemas/encrypted_id'
    get:
      summary: Get buyer by encrypted ID
      tags: [Buyers]
      responses:
        '200': { description: Buyer found. }

  /api/v1/buyers/{buyer}/categories:
    parameters:
      - name: buyer
        in: path
        required: true
        description: "Encrypted buyer ID"
        schema:
          $ref: '#/components/schemas/encrypted_id'
    get:
      summary: List categories for buyer by encrypted ID
      tags: [Buyers]
      parameters:
        - $ref: '#/components/parameters/sort_by_query'
        - $ref: '#/components/parameters/desc_query'
        - $ref: '#/components/parameters/per_page_query'
      responses:
        '200': { description: Categories found. }

  /api/v1/buyers/{buyer}/products:
    parameters:
      - name: buyer
        in: path
        required: true
        description: "Encrypted buyer ID"
        schema:
          $ref: '#/components/schemas/encrypted_id'
    get:
      summary: List products for buyer by encrypted ID
      tags: [Buyers]
      parameters:
        - $ref: '#/components/parameters/sort_by_query'
        - $ref: '#/components/parameters/desc_query'
        - $ref: '#/components/parameters/per_page_query'
      responses:
        '200': { description: Products found. }

  /api/v1/buyers/{buyer}/sellers:
    parameters:
      - name: buyer
        in: path
        required: true
        description: "Encrypted buyer ID"
        schema:
          $ref: '#/components/schemas/encrypted_id'
    get:
      summary: List sellers for buyer by encrypted ID
      tags: [Buyers]
      parameters:
        - $ref: '#/components/parameters/sort_by_query'
        - $ref: '#/components/parameters/desc_query'
        - $ref: '#/components/parameters/per_page_query'
        - $ref: '#/components/parameters/unique_query'
      responses:
        '200': { description: Sellers found. }

  /api/v1/buyers/{buyer}/transactions:
    parameters:
      - name: buyer
        in: path
        required: true
        description: "Encrypted buyer ID"
        schema:
          $ref: '#/components/schemas/encrypted_id'
    get:
      summary: List transactions for buyer by encrypted ID
      tags: [Buyers]
      parameters:
        - $ref: '#/components/parameters/sort_by_query'
        - $ref: '#/components/parameters/desc_query'
        - $ref: '#/components/parameters/per_page_query'
      responses:
        '200': { description: Transactions found. }

  # ─────────────────────────────────────────────────────────────
  # Categories
  # ─────────────────────────────────────────────────────────────
  /api/v1/categories:
    get:
      summary: List all categories
      tags: [Categories]
      parameters:
        - $ref: '#/components/parameters/sort_by_query'
        - $ref: '#/components/parameters/desc_query'
        - $ref: '#/components/parameters/per_page_query'
      responses:
        '200': { description: Categories listed. }
    post:
      summary: Create a new category
      tags: [Categories]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/category_store_input'
      responses:
        '201': { description: Category created. }

  /api/v1/categories/{category}:
    parameters:
      - name: category
        in: path
        required: true
        description: "Encrypted category ID"
        schema:
          $ref: '#/components/schemas/encrypted_id'
    get:
      summary: Get category by encrypted ID
      tags: [Categories]
      responses:
        '200': { description: Category details. }
    put:
      summary: Update category by encrypted ID
      tags: [Categories]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/category_update_input'
            example:
              name: Electronics and Gadgets
              description: Consumer devices, accessories, and smart gear.
      responses:
        '200': { description: Category updated. }
    patch:
      summary: Partially update category by encrypted ID
      tags: [Categories]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/category_update_input'
            example:
              description: Updated category copy for a partial edit.
      responses:
        '200': { description: Category partially updated. }
    delete:
      summary: Delete category by encrypted ID
      tags: [Categories]
      responses:
        '200': { description: Category deleted. }

  /api/v1/categories/{category}/buyers:
    parameters:
      - name: category
        in: path
        required: true
        description: "Encrypted category ID"
        schema:
          $ref: '#/components/schemas/encrypted_id'
    get:
      summary: List buyers for category by encrypted ID
      tags: [Categories]
      parameters:
        - $ref: '#/components/parameters/sort_by_query'
        - $ref: '#/components/parameters/desc_query'
        - $ref: '#/components/parameters/per_page_query'
        - $ref: '#/components/parameters/unique_query'
      responses:
        '200': { description: Buyers found. }

  /api/v1/categories/{category}/products:
    parameters:
      - name: category
        in: path
        required: true
        description: "Encrypted category ID"
        schema:
          $ref: '#/components/schemas/encrypted_id'
    get:
      summary: List products for category by encrypted ID
      tags: [Categories]
      parameters:
        - $ref: '#/components/parameters/sort_by_query'
        - $ref: '#/components/parameters/desc_query'
        - $ref: '#/components/parameters/per_page_query'
      responses:
        '200': { description: Products found. }

  /api/v1/categories/{category}/sellers:
    parameters:
      - name: category
        in: path
        required: true
        description: "Encrypted category ID"
        schema:
          $ref: '#/components/schemas/encrypted_id'
    get:
      summary: List sellers for category by encrypted ID
      tags: [Categories]
      parameters:
        - $ref: '#/components/parameters/sort_by_query'
        - $ref: '#/components/parameters/desc_query'
        - $ref: '#/components/parameters/per_page_query'
        - $ref: '#/components/parameters/unique_query'
      responses:
        '200': { description: Sellers found. }

  /api/v1/categories/{category}/transactions:
    parameters:
      - name: category
        in: path
        required: true
        description: "Encrypted category ID"
        schema:
          $ref: '#/components/schemas/encrypted_id'
    get:
      summary: List transactions for category by encrypted ID
      tags: [Categories]
      parameters:
        - $ref: '#/components/parameters/sort_by_query'
        - $ref: '#/components/parameters/desc_query'
        - $ref: '#/components/parameters/per_page_query'
      responses:
        '200': { description: Transactions found. }

  # ─────────────────────────────────────────────────────────────
  # Products
  # ─────────────────────────────────────────────────────────────
  /api/v1/products:
    get:
      summary: List all products
      tags: [Products]
      parameters:
        - $ref: '#/components/parameters/created_at_query'
        - $ref: '#/components/parameters/sort_by_query'
        - $ref: '#/components/parameters/desc_query'
        - $ref: '#/components/parameters/per_page_query'
      responses:
        '200': { description: Product list. }

  /api/v1/products/{product}:
    parameters:
      - name: product
        in: path
        required: true
        description: "Encrypted product ID"
        schema:
          $ref: '#/components/schemas/encrypted_id'
    get:
      summary: Get product by encrypted ID
      tags: [Products]
      responses:
        '200': { description: Product found. }

  /api/v1/products/{product}/buyers:
    parameters:
      - name: product
        in: path
        required: true
        description: "Encrypted product ID"
        schema:
          $ref: '#/components/schemas/encrypted_id'
    get:
      summary: List buyers for product by encrypted ID
      tags: [Products]
      parameters:
        - $ref: '#/components/parameters/sort_by_query'
        - $ref: '#/components/parameters/desc_query'
        - $ref: '#/components/parameters/per_page_query'
      responses:
        '200': { description: Buyers found. }

  /api/v1/products/{product}/buyers/{buyer}/transactions:
    parameters:
      - name: product
        in: path
        required: true
        description: "Encrypted product ID"
        schema:
          $ref: '#/components/schemas/encrypted_id'
      - name: buyer
        in: path
        required: true
        description: "Encrypted buyer ID"
        schema:
          $ref: '#/components/schemas/encrypted_id'
    post:
      summary: Create a transaction for product by encrypted buyer ID
      tags: [Transactions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/product_buyer_transaction_input'
      responses:
        '201': { description: Transaction created. }

  /api/v1/products/{product}/categories:
    parameters:
      - name: product
        in: path
        required: true
        description: "Encrypted product ID"
        schema:
          $ref: '#/components/schemas/encrypted_id'
    get:
      summary: List categories for product by encrypted ID
      tags: [Products]
      parameters:
        - $ref: '#/components/parameters/sort_by_query'
        - $ref: '#/components/parameters/desc_query'
        - $ref: '#/components/parameters/per_page_query'
      responses:
        '200': { description: Categories listed. }

  /api/v1/products/{product}/categories/{category}:
    parameters:
      - name: product
        in: path
        required: true
        description: "Encrypted product ID"
        schema:
          $ref: '#/components/schemas/encrypted_id'
      - name: category
        in: path
        required: true
        description: "Encrypted category ID"
        schema:
          $ref: '#/components/schemas/encrypted_id'
    put:
      summary: Update product–category link by encrypted IDs
      tags: [Products]
      responses:
        '200': { description: Categories updated. }
    patch:
      summary: Partially update product–category link by encrypted IDs
      tags: [Products]
      responses:
        '200': { description: Categories partially updated. }
    delete:
      summary: Remove product–category link by encrypted IDs
      tags: [Products]
      responses:
        '200': { description: Categories removed. }

  /api/v1/products/{product}/transactions:
    parameters:
      - name: product
        in: path
        required: true
        description: "Encrypted product ID"
        schema:
          $ref: '#/components/schemas/encrypted_id'
    get:
      summary: List transactions for product by encrypted ID
      tags: [Products]
      parameters:
        - $ref: '#/components/parameters/sort_by_query'
        - $ref: '#/components/parameters/desc_query'
        - $ref: '#/components/parameters/per_page_query'
      responses:
        '200': { description: Transactions listed. }

  # ─────────────────────────────────────────────────────────────
  # Sellers
  # ─────────────────────────────────────────────────────────────
  /api/v1/sellers:
    get:
      summary: List all sellers
      tags: [Sellers]
      parameters:
        - $ref: '#/components/parameters/verified_query'
        - $ref: '#/components/parameters/sort_by_query'
        - $ref: '#/components/parameters/desc_query'
        - $ref: '#/components/parameters/per_page_query'
      responses:
        '200': { description: Sellers listed. }

  /api/v1/sellers/{seller}:
    parameters:
      - name: seller
        in: path
        required: true
        description: "Encrypted seller ID"
        schema:
          $ref: '#/components/schemas/encrypted_id'
    get:
      summary: Get seller by encrypted ID
      tags: [Sellers]
      responses:
        '200': { description: Seller found. }

  /api/v1/sellers/{seller}/buyers:
    parameters:
      - name: seller
        in: path
        required: true
        description: "Encrypted seller ID"
        schema:
          $ref: '#/components/schemas/encrypted_id'
    get:
      summary: List buyers for seller by encrypted ID
      tags: [Sellers]
      parameters:
        - $ref: '#/components/parameters/sort_by_query'
        - $ref: '#/components/parameters/desc_query'
        - $ref: '#/components/parameters/per_page_query'
        - $ref: '#/components/parameters/unique_query'
      responses:
        '200': { description: Buyers listed. }

  /api/v1/sellers/{seller}/categories:
    parameters:
      - name: seller
        in: path
        required: true
        description: "Encrypted seller ID"
        schema:
          $ref: '#/components/schemas/encrypted_id'
    get:
      summary: List categories for seller by encrypted ID
      tags: [Sellers]
      parameters:
        - $ref: '#/components/parameters/sort_by_query'
        - $ref: '#/components/parameters/desc_query'
        - $ref: '#/components/parameters/per_page_query'
        - $ref: '#/components/parameters/unique_query'
      responses:
        '200': { description: Categories listed. }

  /api/v1/sellers/{seller}/products:
    parameters:
      - name: seller
        in: path
        required: true
        description: "Encrypted seller ID"
        schema:
          $ref: '#/components/schemas/encrypted_id'
    get:
      summary: List products for seller by encrypted ID
      tags: [Sellers]
      parameters:
        - $ref: '#/components/parameters/sort_by_query'
        - $ref: '#/components/parameters/desc_query'
        - $ref: '#/components/parameters/per_page_query'
      responses:
        '200': { description: Products listed. }
    post:
      summary: Create a product for seller by encrypted ID
      tags: [Sellers]
      description: Submit this request as multipart form data because the product image is uploaded as a file.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/seller_product_store_input'
            encoding:
              image:
                contentType: image/*
            examples:
              create_product:
                summary: Create product with image upload
                value:
                  name: Wireless Keyboard
                  description: Compact mechanical keyboard.
                  quantity: 10
                  image: binary file upload
      responses:
        '201': { description: Product created. }

  /api/v1/sellers/{seller}/products/{product}:
    parameters:
      - name: seller
        in: path
        required: true
        description: "Encrypted seller ID"
        schema:
          $ref: '#/components/schemas/encrypted_id'
      - name: product
        in: path
        required: true
        description: "Encrypted product ID"
        schema:
          $ref: '#/components/schemas/encrypted_id'
    get:
      summary: Get seller’s product by encrypted IDs
      tags: [Sellers]
      responses:
        '200': { description: Product found. }
    put:
      summary: Update seller’s product by encrypted IDs
      tags: [Sellers]
      description: Submit this request as multipart form data. Use PUT when sending a fuller replacement-style update.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/seller_product_update_input'
            encoding:
              image:
                contentType: image/*
            examples:
              full_update:
                summary: Full product update
                value:
                  name: Wireless Keyboard Pro
                  description: Full-size mechanical keyboard with backlight.
                  quantity: 12
                  status: available
                  image: binary file upload
      responses:
        '200': { description: Product updated. }
    patch:
      summary: Partially update seller’s product by encrypted IDs
      tags: [Sellers]
      description: Submit this request as multipart form data. Use PATCH when sending only the fields being changed.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/seller_product_update_input'
            encoding:
              image:
                contentType: image/*
            examples:
              partial_update:
                summary: Partial product update
                value:
                  quantity: 8
                  status: unavailable
      responses:
        '200': { description: Product partially updated. }
    delete:
      summary: Delete seller’s product by encrypted IDs
      tags: [Sellers]
      responses:
        '200': { description: Product deleted. }

  /api/v1/sellers/{seller}/transactions:
    parameters:
      - name: seller
        in: path
        required: true
        description: "Encrypted seller ID"
        schema:
          $ref: '#/components/schemas/encrypted_id'
    get:
      summary: List transactions for seller by encrypted ID
      tags: [Sellers]
      parameters:
        - $ref: '#/components/parameters/sort_by_query'
        - $ref: '#/components/parameters/desc_query'
        - $ref: '#/components/parameters/per_page_query'
      responses:
        '200': { description: Transactions listed. }

  # ─────────────────────────────────────────────────────────────
  # Transactions
  # ─────────────────────────────────────────────────────────────
  /api/v1/transactions:
    get:
      summary: List all transactions
      tags: [Transactions]
      parameters:
        - $ref: '#/components/parameters/sort_by_query'
        - $ref: '#/components/parameters/desc_query'
        - $ref: '#/components/parameters/per_page_query'
      responses:
        '200': { description: Transactions listed. }

  /api/v1/transactions/{transaction}:
    parameters:
      - name: transaction
        in: path
        required: true
        description: "Encrypted transaction ID"
        schema:
          $ref: '#/components/schemas/encrypted_id'
    get:
      summary: Get transaction by encrypted ID
      tags: [Transactions]
      responses:
        '200': { description: Transaction found. }

  /api/v1/transactions/{transaction}/categories:
    parameters:
      - name: transaction
        in: path
        required: true
        description: "Encrypted transaction ID"
        schema:
          $ref: '#/components/schemas/encrypted_id'
    get:
      summary: List categories for transaction by encrypted ID
      tags: [Transactions]
      responses:
        '200': { description: Categories listed. }

  /api/v1/transactions/{transaction}/sellers:
    parameters:
      - name: transaction
        in: path
        required: true
        description: "Encrypted transaction ID"
        schema:
          $ref: '#/components/schemas/encrypted_id'
    get:
      summary: List sellers for transaction by encrypted ID
      tags: [Transactions]
      responses:
        '200': { description: Sellers listed. }

components:
  parameters:
    verified_query:
      name: verified
      in: query
      required: false
      description: Filter results by verification state.
      schema:
        type: string
        enum: ['0', '1', 'true', 'false']
      example: '1'
    admin_query:
      name: admin
      in: query
      required: false
      description: Filter results by admin flag.
      schema:
        type: string
        enum: ['0', '1', 'true', 'false']
      example: 'true'
    sort_by_query:
      name: sort_by
      in: query
      required: false
      description: Sort results by an allowed model field.
      schema:
        type: string
      example: name
    desc_query:
      name: desc
      in: query
      required: false
      description: Reverse the sort direction.
      schema:
        type: string
        enum: ['true', 'false', '1', '0']
      example: 'true'
    per_page_query:
      name: per_page
      in: query
      required: false
      description: Page size between 2 and 50, or disabled to turn pagination off.
      schema:
        oneOf:
          - type: integer
            minimum: 2
            maximum: 50
          - type: string
            enum: [disabled]
      example: 10
    unique_query:
      name: unique
      in: query
      required: false
      description: Return only unique related results.
      schema:
        type: string
        enum: ['0', '1', 'true', 'false']
      example: 'true'
    created_at_query:
      name: created_at
      in: query
      required: false
      description: Filter products by exact created timestamp.
      schema:
        type: string
      example: '2020-06-14 05:39:56'
  schemas:
    encrypted_id:
      type: string
      pattern: '^[A-Za-z0-9+/]+=*$'
      description: "Encrypted ID"
    user_store_input:
      type: object
      required: [name, email, password, password_confirmation]
      properties:
        name:
          type: string
          example: Jane Doe
        email:
          type: string
          format: email
          example: jane@example.com
        password:
          type: string
          format: password
          minLength: 6
          example: secret123
        password_confirmation:
          type: string
          format: password
          minLength: 6
          example: secret123
    user_update_input:
      type: object
      properties:
        name:
          type: string
          example: Jane Doe
        email:
          type: string
          format: email
          example: jane@example.com
        password:
          type: string
          format: password
          minLength: 6
          example: secret123
        password_confirmation:
          type: string
          format: password
          minLength: 6
          example: secret123
        admin:
          type: string
          description: Admin flag enum as accepted by the API.
          example: false
    category_store_input:
      type: object
      required: [name, description]
      properties:
        name:
          type: string
          example: Electronics
        description:
          type: string
          example: Devices and accessories.
    category_update_input:
      type: object
      properties:
        name:
          type: string
          example: Electronics
        description:
          type: string
          example: Devices and accessories.
    product_buyer_transaction_input:
      type: object
      required: [quantity]
      properties:
        quantity:
          type: integer
          minimum: 1
          example: 2
    seller_product_store_input:
      type: object
      required: [name, description, quantity, image]
      properties:
        name:
          type: string
          example: Wireless Keyboard
        description:
          type: string
          example: Compact mechanical keyboard.
        quantity:
          type: integer
          minimum: 1
          example: 10
        image:
          type: string
          format: binary
          description: Upload the product image file.
    seller_product_update_input:
      type: object
      properties:
        name:
          type: string
          example: Wireless Keyboard
        description:
          type: string
          example: Compact mechanical keyboard.
        quantity:
          type: integer
          minimum: 1
          example: 10
        status:
          type: string
          enum: [available, unavailable]
          example: available
        image:
          type: string
          format: binary
          description: Optionally upload a replacement product image file.
